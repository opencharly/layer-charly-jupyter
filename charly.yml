charly-jupyter:
    candy:
        description: |-
            Metadata concept candy owning the charly-jupyter skills whose names have no namesake candy (jupyter dev/data-science images). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the jupyter concept candy's skill entities are present and generated into the marketplace's jupyter/skills
              id: charly-jupyter-present
              context:
                - build
              command: "true"

jupyter-layer-skill:
    skill:
        name: jupyter-layer
        family: jupyter
        owner: charly-jupyter
        description: |-
            Lightweight JupyterLab with real-time collaboration (jupyter-collaboration) on port 8888.
            No GPU required. Use when working with collaborative notebooks, jupyter-collaboration,
            or lightweight Jupyter environments without ML/CUDA dependencies.
jupyter-ml-layer-skill:
    skill:
        name: jupyter-ml-layer
        family: jupyter
        owner: charly-jupyter
        description: |-
            Full CUDA ML stack + JupyterLab with real-time collaboration and CRDT MCP server on port 8888.
            Use when working with GPU-accelerated Jupyter notebooks, ML training with collaboration,
            or the jupyter-ml candy.
unsloth-studio-layer-skill:
    skill:
        name: unsloth-studio-layer
        family: jupyter
        owner: charly-jupyter
        description: |-
            Unsloth Studio fine-tuning web UI on ports 8888/8000 with vLLM inference.
            Tier 2 environment-owner meta-layer composing llama-cpp + unsloth, owns pixi.toml.
            Use when working with Unsloth Studio, the fine-tuning web UI, or the unsloth-studio box.
